name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build and package macOS app
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i '' "/^name = \"openstudio\"/{n;s/version = \".*\"/version = \"$VERSION\"/;}" Cargo.lock

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package app and DMG
        run: cargo packager --release

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-dmg
          path: target/release/*.dmg
          if-no-files-found: error

      - name: Publish DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/*.dmg

  build-admin-macos:
    name: Build and package macOS admin app
    runs-on: macos-14

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Set admin version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build admin DMG
        run: npm run dist -- --mac dmg --publish never -c.mac.identity=-

      - name: Upload admin DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-Admin-dmg
          path: admin/dist/*.dmg
          if-no-files-found: error

      - name: Publish admin DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/dist/*.dmg

  build-linux:
    name: Build and package Linux ${{ matrix.deb-arch }} app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - deb-arch: amd64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - deb-arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"openstudio\"/{n;s/version = \".*\"/version = \"$VERSION\"/;}" Cargo.lock

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust-target }}

      - name: Package DEB
        run: cargo packager --release --formats deb --target ${{ matrix.rust-target }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-linux-${{ matrix.deb-arch }}-deb
          path: target/release/*.deb
          if-no-files-found: error

      - name: Publish DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/*.deb

  build-admin-linux:
    name: Build and package Linux ${{ matrix.deb-arch }} admin app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - deb-arch: amd64
            runner: ubuntu-latest
            electron-arch: x64
          - deb-arch: arm64
            runner: ubuntu-24.04-arm
            electron-arch: arm64

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Set admin version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build admin DEB
        run: npm run dist -- --linux deb --${{ matrix.electron-arch }} --publish never

      - name: Upload Linux admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-Admin-linux-${{ matrix.deb-arch }}-deb
          path: admin/dist/*.deb
          if-no-files-found: error

      - name: Publish admin DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/dist/*.deb

  build-windows:
    name: Build and package Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"openstudio\"/{n;s/version = \".*\"/version = \"$VERSION\"/;}" Cargo.lock

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package NSIS installer
        run: cargo packager --release --formats nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-windows
          path: target/release/*-setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/*-setup.exe

  build-admin-windows:
    name: Build and package Windows admin app
    runs-on: windows-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Set admin version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build admin NSIS installer
        run: npm run dist -- --win nsis --publish never

      - name: Upload Windows admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-Admin-windows
          path: admin/dist/*Setup*.exe
          if-no-files-found: error

      - name: Publish admin to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/dist/*Setup*.exe
