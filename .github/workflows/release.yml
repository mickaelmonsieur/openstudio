name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build and package macOS ${{ matrix.artifact-arch }} app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-arch: arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
          - artifact-arch: x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i '' "/^name = \"openstudio\"/{n;s/version = \".*\"/version = \"$VERSION\"/;}" Cargo.lock

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust-target }}

      - name: Package app and DMG
        run: cargo packager --release --target ${{ matrix.rust-target }}

      - name: Rename DMG artifact
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          mv target/${{ matrix.rust-target }}/release/*.dmg "target/${{ matrix.rust-target }}/release/openstudio_${VERSION}_macos_${{ matrix.artifact-arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-macos-${{ matrix.artifact-arch }}-dmg
          path: target/${{ matrix.rust-target }}/release/openstudio_*_macos_${{ matrix.artifact-arch }}.dmg
          if-no-files-found: error

      - name: Publish DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.rust-target }}/release/openstudio_*_macos_${{ matrix.artifact-arch }}.dmg

  build-admin-macos:
    name: Build and package macOS ${{ matrix.artifact-arch }} admin app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-arch: arm64
            runner: macos-14
            electron-arch: arm64
          - artifact-arch: x64
            runner: macos-15-intel
            electron-arch: x64

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Set admin version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build admin DMG
        run: npm run dist -- --mac dmg --${{ matrix.electron-arch }} --publish never -c.mac.identity=-

      - name: Rename admin DMG artifact
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          mv dist/*.dmg "dist/openstudio-admin_${VERSION}_macos_${{ matrix.artifact-arch }}.dmg"

      - name: Upload admin DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-admin-macos-${{ matrix.artifact-arch }}-dmg
          path: admin/dist/openstudio-admin_*_macos_${{ matrix.artifact-arch }}.dmg
          if-no-files-found: error

      - name: Publish admin DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/dist/openstudio-admin_*_macos_${{ matrix.artifact-arch }}.dmg

  build-linux:
    name: Build and package Linux ${{ matrix.deb-arch }} app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - deb-arch: amd64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - deb-arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"openstudio\"/{n;s/version = \".*\"/version = \"$VERSION\"/;}" Cargo.lock

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust-target }}

      - name: Package DEB
        run: cargo packager --release --formats deb --target ${{ matrix.rust-target }}

      - name: Rename DEB artifact
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          mv target/${{ matrix.rust-target }}/release/*.deb "target/${{ matrix.rust-target }}/release/openstudio_${VERSION}_linux_${{ matrix.deb-arch }}.deb"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-linux-${{ matrix.deb-arch }}-deb
          path: target/${{ matrix.rust-target }}/release/openstudio_*_linux_${{ matrix.deb-arch }}.deb
          if-no-files-found: error

      - name: Publish DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.rust-target }}/release/openstudio_*_linux_${{ matrix.deb-arch }}.deb

  build-admin-linux:
    name: Build and package Linux ${{ matrix.deb-arch }} admin app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - deb-arch: amd64
            runner: ubuntu-latest
            electron-arch: x64
          - deb-arch: arm64
            runner: ubuntu-24.04-arm
            electron-arch: arm64

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Set admin version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build admin DEB
        run: npm run dist -- --linux deb --${{ matrix.electron-arch }} --publish never

      - name: Rename admin DEB artifact
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          mv dist/*.deb "dist/openstudio-admin_${VERSION}_linux_${{ matrix.deb-arch }}.deb"

      - name: Upload Linux admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-admin-linux-${{ matrix.deb-arch }}-deb
          path: admin/dist/openstudio-admin_*_linux_${{ matrix.deb-arch }}.deb
          if-no-files-found: error

      - name: Publish admin DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/dist/openstudio-admin_*_linux_${{ matrix.deb-arch }}.deb

  build-windows:
    name: Build and package Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install streaming native libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-libshout

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"openstudio\"/{n;s/version = \".*\"/version = \"$VERSION\"/;}" Cargo.lock

      - name: Build release binary
        shell: bash
        env:
          OPENSTUDIO_LAME_LIB_DIR: C:/msys64/mingw64/lib
          OPENSTUDIO_SHOUT_LIB_DIR: C:/msys64/mingw64/lib
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Collect streaming DLLs
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          mkdir -p packaging/windows
          cp /c/msys64/mingw64/bin/libmp3lame-0.dll packaging/windows/
          cp /c/msys64/mingw64/bin/libshout-3.dll packaging/windows/
          copy_deps() {
            ldd "$1" \
              | awk '/mingw64/ { print $3 }' \
              | while read -r dll; do
                  case "$(basename "$dll")" in
                    libgcc_s_seh-1.dll|libstdc++-6.dll|libwinpthread-1.dll|libogg-0.dll|libvorbis-0.dll|libvorbisenc-2.dll|libspeex-1.dll|libtheora-0.dll|libssl-*.dll|libcrypto-*.dll|zlib1.dll|libbrotlicommon.dll|libbrotlidec.dll|libcurl-*.dll|libidn2-*.dll|libnghttp2-*.dll|libssh2-*.dll|libunistring-*.dll|libzstd.dll)
                      cp "$dll" packaging/windows/
                      ;;
                  esac
                done
          }
          copy_deps target/x86_64-pc-windows-gnu/release/openstudio.exe
          copy_deps /c/msys64/mingw64/bin/libmp3lame-0.dll
          copy_deps /c/msys64/mingw64/bin/libshout-3.dll
          ls -la packaging/windows

      - name: Package NSIS installer
        shell: bash
        env:
          OPENSTUDIO_LAME_LIB_DIR: C:/msys64/mingw64/lib
          OPENSTUDIO_SHOUT_LIB_DIR: C:/msys64/mingw64/lib
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          cargo packager --release --formats nsis --target x86_64-pc-windows-gnu

      - name: Rename Windows artifact
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          mv target/x86_64-pc-windows-gnu/release/*-setup.exe "target/x86_64-pc-windows-gnu/release/openstudio_${VERSION}_windows_x64_setup.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-windows-x64
          path: target/x86_64-pc-windows-gnu/release/openstudio_*_windows_x64_setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-gnu/release/openstudio_*_windows_x64_setup.exe

  build-admin-windows:
    name: Build and package Windows admin app
    runs-on: windows-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Set admin version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build admin NSIS installer
        run: npm run dist -- --win nsis --publish never

      - name: Rename Windows admin artifact
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          mv dist/*Setup*.exe "dist/openstudio-admin_${VERSION}_windows_x64_setup.exe"

      - name: Upload Windows admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-admin-windows-x64
          path: admin/dist/openstudio-admin_*_windows_x64_setup.exe
          if-no-files-found: error

      - name: Publish admin to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/dist/openstudio-admin_*_windows_x64_setup.exe
